<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-pos">
        <div class="container">
            <a class="navbar-brand text-white" href="/">
                <i class="bi bi-cart-check-fill me-2"></i>POS System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/products"><i class="bi bi-box-seam me-1"></i>Produk</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/transactions"><i class="bi bi-cart3 me-1"></i>Transaksi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/reports"><i class="bi bi-file-earmark-text me-1"></i>Laporan</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white-50 small" id="userInfo"></span>
                    <button class="btn btn-sm btn-logout" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container main-content">
        <h2 class="page-title"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h2>

        <!-- STAT CARDS -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-value" id="statProducts">-</div>
                            <div class="stat-label">Produk</div>
                        </div>
                        <div class="stat-icon bg-products"><i class="bi bi-box-seam"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-value" id="statTransactions">-</div>
                            <div class="stat-label">Transaksi</div>
                        </div>
                        <div class="stat-icon bg-transactions"><i class="bi bi-cart3"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-value text-rupiah" id="statRevenue">-</div>
                            <div class="stat-label">Pendapatan</div>
                        </div>
                        <div class="stat-icon bg-revenue"><i class="bi bi-cash-stack"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-value" id="statCashiers">-</div>
                            <div class="stat-label">Kasir</div>
                        </div>
                        <div class="stat-icon bg-cashiers"><i class="bi bi-people"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <!-- CHART -->
            <div class="col-lg-7">
                <div class="card-pos">
                    <div class="card-header">
                        <i class="bi bi-bar-chart me-2"></i>Penjualan Per Kategori
                    </div>
                    <div class="card-body">
                        <canvas id="salesChart" height="250"></canvas>
                    </div>
                </div>
            </div>

            <!-- TOP PRODUCTS -->
            <div class="col-lg-5">
                <div class="card-pos">
                    <div class="card-header">
                        <i class="bi bi-trophy me-2"></i>Top 5 Produk
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush" id="topProductsList">
                            <div class="text-center p-3 text-muted">Memuat...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RECENT TRANSACTIONS -->
        <div class="row mt-3">
            <div class="col-12">
                <div class="card-pos">
                    <div class="card-header">
                        <i class="bi bi-clock-history me-2"></i>Transaksi Terakhir
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-pos mb-0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Produk</th>
                                        <th>Qty</th>
                                        <th>Total</th>
                                        <th>Tanggal</th>
                                    </tr>
                                </thead>
                                <tbody id="recentTransBody">
                                    <tr><td colspan="5" class="text-center text-muted py-3">Memuat...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
