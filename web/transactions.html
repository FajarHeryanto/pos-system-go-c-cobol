<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi — POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-pos">
        <div class="container">
            <a class="navbar-brand text-white" href="/"><i class="bi bi-cart-check-fill me-2"></i>POS System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products"><i class="bi bi-box-seam me-1"></i>Produk</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/transactions"><i class="bi bi-cart3 me-1"></i>Transaksi</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reports"><i class="bi bi-file-earmark-text me-1"></i>Laporan</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white-50 small" id="userInfo"></span>
                    <button class="btn btn-sm btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container main-content">
        <h2 class="page-title"><i class="bi bi-cart3 me-2"></i>Transaksi Penjualan</h2>

        <div class="row g-3">
            <!-- FORM TRANSAKSI BARU -->
            <div class="col-lg-5">
                <div class="card-pos">
                    <div class="card-header">
                        <i class="bi bi-plus-circle me-2"></i>Transaksi Baru
                    </div>
                    <div class="card-body">
                        <form id="transactionForm">
                            <div class="mb-3">
                                <label for="txProduk" class="form-label">Produk <span class="text-danger">*</span></label>
                                <select class="form-select" id="txProduk" required>
                                    <option value="">Pilih Produk...</option>
                                </select>
                                <div class="form-text" id="txProdukInfo"></div>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="txQty" class="form-label">Quantity <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="txQty" min="1" value="1" required>
                                </div>
                                <div class="col-6">
                                    <label for="txDiskon" class="form-label">Diskon (%)</label>
                                    <input type="number" class="form-control" id="txDiskon" min="0" max="100" value="0">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Metode Bayar <span class="text-danger">*</span></label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="txPayment" id="payCash" value="Cash" checked>
                                        <label class="form-check-label" for="payCash">Cash</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="txPayment" id="payDebit" value="Debit">
                                        <label class="form-check-label" for="payDebit">Debit</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="txPayment" id="payCredit" value="Credit">
                                        <label class="form-check-label" for="payCredit">Credit</label>
                                    </div>
                                </div>
                            </div>

                            <!-- RINGKASAN HARGA -->
                            <div class="bg-light rounded p-3 mb-3">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-muted">Subtotal</span>
                                    <span id="txSubtotal" class="text-rupiah">Rp 0</span>
                                </div>
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-muted">Diskon</span>
                                    <span id="txDiscountAmt" class="text-danger text-rupiah">- Rp 0</span>
                                </div>
                                <hr class="my-2">
                                <div class="d-flex justify-content-between">
                                    <strong>Total</strong>
                                    <strong id="txTotal" class="text-primary text-rupiah" style="font-size: 1.2rem;">Rp 0</strong>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" id="btnSubmitTx">
                                <i class="bi bi-check2-circle me-1"></i>Simpan Transaksi
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RIWAYAT TRANSAKSI -->
            <div class="col-lg-7">
                <div class="card-pos">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-clock-history me-2"></i>Riwayat Transaksi</span>
                        <span class="badge bg-primary" id="txCount">0</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                            <table class="table table-pos mb-0">
                                <thead style="position: sticky; top: 0;">
                                    <tr>
                                        <th>ID</th>
                                        <th>Produk</th>
                                        <th>Qty</th>
                                        <th>Total</th>
                                        <th>Bayar</th>
                                        <th>Tanggal</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="txTableBody">
                                    <tr><td colspan="7" class="text-center text-muted py-4">Memuat...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL STRUK -->
    <div class="modal fade" id="receiptModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-receipt me-2"></i>Struk Transaksi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="receipt-box" id="receiptContent"></div>
                </div>
                <div class="modal-footer no-print">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                    <button type="button" class="btn btn-primary" onclick="window.print()">
                        <i class="bi bi-printer me-1"></i>Cetak
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/transactions.js"></script>
</body>
</html>
