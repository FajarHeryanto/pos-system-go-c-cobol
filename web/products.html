<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk — POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-pos">
        <div class="container">
            <a class="navbar-brand text-white" href="/"><i class="bi bi-cart-check-fill me-2"></i>POS System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/products"><i class="bi bi-box-seam me-1"></i>Produk</a></li>
                    <li class="nav-item"><a class="nav-link" href="/transactions"><i class="bi bi-cart3 me-1"></i>Transaksi</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reports"><i class="bi bi-file-earmark-text me-1"></i>Laporan</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white-50 small" id="userInfo"></span>
                    <button class="btn btn-sm btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="page-title mb-0"><i class="bi bi-box-seam me-2"></i>Manajemen Produk</h2>
            <button class="btn btn-pos-primary" onclick="openAddModal()">
                <i class="bi bi-plus-lg me-1"></i>Tambah Produk
            </button>
        </div>

        <!-- SEARCH & FILTER -->
        <div class="search-filter-bar">
            <input type="text" class="form-control" id="searchInput" placeholder="Cari nama produk..." style="max-width: 300px;">
            <select class="form-select" id="filterCategory" style="max-width: 200px;">
                <option value="">Semua Kategori</option>
                <option value="Makanan">Makanan</option>
                <option value="Minuman">Minuman</option>
                <option value="Elektronik">Elektronik</option>
                <option value="Alat Tulis">Alat Tulis</option>
                <option value="Kebutuhan RT">Kebutuhan RT</option>
            </select>
            <span class="text-muted align-self-center small" id="productCount"></span>
        </div>

        <!-- TABLE -->
        <div class="card-pos">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-pos mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nama Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <tr><td colspan="6" class="text-center text-muted py-4">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH/EDIT PRODUK -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Produk</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="productForm">
                    <div class="modal-body">
                        <input type="hidden" id="editProductId">
                        <div class="mb-3">
                            <label for="prodName" class="form-label">Nama Produk <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="prodName" required minlength="2" maxlength="50"
                                   placeholder="Contoh: Nasi Goreng">
                        </div>
                        <div class="mb-3">
                            <label for="prodCategory" class="form-label">Kategori <span class="text-danger">*</span></label>
                            <select class="form-select" id="prodCategory" required>
                                <option value="">Pilih Kategori</option>
                                <option value="Makanan">Makanan</option>
                                <option value="Minuman">Minuman</option>
                                <option value="Elektronik">Elektronik</option>
                                <option value="Alat Tulis">Alat Tulis</option>
                                <option value="Kebutuhan RT">Kebutuhan RT</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="prodPrice" class="form-label">Harga (Rp) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="prodPrice" required min="1" max="99999999"
                                   placeholder="Contoh: 25000">
                        </div>
                        <div class="mb-3">
                            <label for="prodStock" class="form-label">Stok</label>
                            <input type="number" class="form-control" id="prodStock" min="0" value="0"
                                   placeholder="Contoh: 100">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary" id="btnSaveProduct">
                            <i class="bi bi-check-lg me-1"></i>Simpan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL KONFIRMASI HAPUS -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-1"></i>Hapus Produk</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Yakin ingin menghapus produk <strong id="deleteProductName"></strong>?</p>
                    <p class="text-muted small mb-0">Tindakan ini tidak dapat dibatalkan.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-danger btn-sm" id="btnConfirmDelete">
                        <i class="bi bi-trash me-1"></i>Hapus
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/products.js"></script>
</body>
</html>
